[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodsim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
viz = ["plotly", "pillow"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["floodsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
