[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodsim"
version = "0.1.0"
description = "Seeded flood scenarios and a motor-glider SAR swarm environment"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
viz = ["plotly", "pillow"]
test = ["pytest"]

[tool.setuptools]
packages = ["floodsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower tests (many seeds or full episodes)"]
