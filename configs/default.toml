# FloodSim defaults. Every value here matches the dataclass default in
# floodsim/config.py; uncomment and edit to change one.

[team]
# Placeholders: set these from the team's airframe before tuning.
mass_kg = 5.0
battery_life_min = 150.0      # level flight at 13 m/s on a full battery
# battery_wh = 180.0          # set instead of battery_life_min if known
charge_time_min = 10.0        # battery swap at base
signal_radius_km = 3.0        # radio range, drone-drone and drone-base
camera_range_m = 140.0        # 50% detection height for a person on land

