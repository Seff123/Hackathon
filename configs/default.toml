# FloodSim default configuration. Every value here overrides the dataclass default in floodsim/config.py.
# Team inputs: set these before training. The placeholders only let the build run.
[team]
mass_kg = 1.5
battery_life_min = 150.0      # team value: level flight at the 15 m/s cruise on a full battery
charge_time_min = 10.0
signal_radius_km = 8.0       # team value (2026-11-08): radio range, drone-drone and drone-base
camera_range_m = 140.0
# battery_wh = 180.0   # give this instead of battery_life_min if known

[airframe]
# Team airframe (from main, 2026-11-08): 1 m span, best glide and cruise 15 m/s. Wing area from best glide at
# 15 m/s with cd0 0.018 and e 0.85 (aspect ratio 4.2, L/D 12.5, stall 8.8 m/s); thrust 4.2 N (~3 m/s climb at
# 15 m/s); payload + avionics 10 W. 150 min at 15 m/s -> ~93 Wh battery.
span = 1.0
wing_area = 0.237
thrust_max = 4.2
payload_w = 10.0
v_ref = 15.0
climb_speed = 15.0

[sim]
swap = true

[controller]
search_height_frac = 0.6
e_soar = 0.6
w_enter = 0.8
